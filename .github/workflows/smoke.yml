name: Smoke test

on:
  # Cloudflare Pages reports each deployment back to GitHub
  deployment_status:
  schedule:
    - cron: '0 6 * * *' # daily, catches upstream breakage (dead keys, retired models)
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run smoke
        env:
          BASE: ${{ github.event.deployment_status.environment_url || 'https://quiz.shvnk.in' }}
